<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>OCR test</title></head>
<body>
<pre id="out">loading OCR...</pre>
<script type="module">
import { createWorker } from 'tesseract.js'
const out = document.getElementById('out')
try {
  const worker = await createWorker('ara', 1, {
    logger: (m) => { if (m.status === 'recognizing text') out.textContent = 'OCR ' + Math.round((m.progress||0)*100) + '%' },
  })
  const { data } = await worker.recognize('./outputs/fahem-page1.png')
  out.textContent = data.text.slice(0, 4000)
  window.__ocr = data.text
  await worker.terminate()
  document.title = 'done'
} catch (error) {
  out.textContent = 'ERROR: ' + error.message
  document.title = 'error'
}
</script>
</body></html>
