<!doctype html>
<html><head><meta charset="utf-8"><title>render</title></head><body>
<canvas id="c"></canvas>
<script type="module">
import * as pdfjs from 'pdfjs-dist'
import workerUrl from 'pdfjs-dist/build/pdf.worker.min.mjs?url'
pdfjs.GlobalWorkerOptions.workerSrc = workerUrl
const params = new URLSearchParams(location.search)
const file = params.get('file') || 'i3lem.pdf'
const pageNumber = Number(params.get('page') || '1')
const scale = Number(params.get('scale') || '2.2')
const doc = await pdfjs.getDocument({ url: './fixtures/' + file }).promise
const page = await doc.getPage(pageNumber)
const viewport = page.getViewport({ scale })
const canvas = document.getElementById('c')
canvas.width = Math.ceil(viewport.width)
canvas.height = Math.ceil(viewport.height)
const ctx = canvas.getContext('2d')
ctx.fillStyle = '#fff'
ctx.fillRect(0, 0, canvas.width, canvas.height)
await page.render({ canvasContext: ctx, viewport }).promise
window.__png = canvas.toDataURL('image/png')
document.title = 'ready'
</script>
</body></html>
