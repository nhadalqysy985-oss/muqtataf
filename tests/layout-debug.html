<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8" /><title>layout debug</title></head>
<body>
<pre id="out">loading...</pre>
<script type="module">
import * as pdfjs from 'pdfjs-dist'
import workerUrl from 'pdfjs-dist/build/pdf.worker.min.mjs?url'
import { readPageText } from '/src/lib/pdf.ts'
pdfjs.GlobalWorkerOptions.workerSrc = workerUrl
const params = new URLSearchParams(location.search)
const file = params.get('file') || 'i3lem.pdf'
const pageNumber = Number(params.get('page') || '1')
const bytes = new Uint8Array(await (await fetch('./fixtures/' + file)).arrayBuffer())
const doc = await pdfjs.getDocument({ data: bytes }).promise
const page = await doc.getPage(pageNumber)
const info = await readPageText(page, pageNumber)
const lines = info.coverLines.map(l => ({ y: +l.y.toFixed(1), x: +l.x.toFixed(1), w: +l.width.toFixed(1), c: l.column, s: l.text.slice(0, 80) }))
document.getElementById('out').textContent = JSON.stringify({ width: info.width, height: info.height, lines: lines.slice(0, 80) }, null, 2)
window.__debug = lines
</script>
</body></html>
